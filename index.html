<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen">
  </head>
  <body class="todo-app">
    <header class="aaa">
      <img class="header-img" src="./eisenhower-matrix.jpg" alt="visual representation of the eisenhauser matrix">
      <a class="more_inf" href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </header>
    <main class="centered-main-page-element">
      <h1 class="h1">Todo App</h1>
      <section id="topSectionForAddingElementToList">
        <h2>
          <label class="add-item-label" for="new-task">Add Item</label>
          </h2>
        <div class="task-row-wrapper">
          <input id="new-task"class="task input input-text" type="text">
          <button class="btn">Add</button>
        </div>
      </section>
      <section>
        <h2 class="section-title">Todo</h2>
        <ul id="incompleteTasks" class="list">
          <li class="list-item">
            <input class="input input-checkbox" type="checkbox">
            <label class="task label">Pay Bills</label>
            <input type="text" class="input task input-text">
            <button class="btn edit">Edit</button>
            <button class="btn delete">
              <img class="remove-img" src="./remove.svg" alt="image button remove task">
            </button>
          </li>
          <li class="editMode list-item">
            <input class="input input-checkbox" type="checkbox">
            <label class="task label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="input task input-text">
            <button class="btn edit">Save</button>
            <button class="btn delete">
              <img class="remove-img" src="./remove.svg" alt="image button remove task">
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2 class="section-title">Completed</h2>
        <ul id="completed-tasks" class="list">
          <li class="list-item">
            <input class="input input-checkbox" type="checkbox" checked>
            <label class="task label">See the Doctor</label>
            <input type="text" class="input task input-text">
            <button class="btn edit">Edit</button>
            <button class="btn delete">
              <img class="remove-img" src="./remove.svg" alt="image button remove task">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
